AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SAM template that provisions an Amazon DynamoDB "Orders" table with on-demand
  (pay-per-request) capacity, a Node.js Lambda function to save orders, and an
  Amazon API Gateway REST API exposing POST /orders.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: nodejs24.x
    Tracing: Active

Resources:
  OrdersUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: OrdersUserPool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false

  OrdersUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: OrdersUserPoolClient
      UserPoolId: !Ref OrdersUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # IAM role assumed by API Gateway for direct service integrations:
  #   - reading from DynamoDB (GET /orders/{orderId})
  #   - sending order messages to SQS (POST /orders)
  ApiGatewayDynamoDBRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OrdersTableReadAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:GetItem
                Resource: !GetAtt OrdersGlobalTable.Arn
        - PolicyName: OrderIntakeQueueSendAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt OrderIntakeQueue.Arn

  # Intake queue that decouples the API from order processing. API Gateway
  # writes to this queue; SaveOrder consumes from it asynchronously.
  OrderIntakeDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: OrderIntakeDLQ
      MessageRetentionPeriod: 1209600 # 14 days

  OrderIntakeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: OrderIntakeQueue
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrderIntakeDLQ.Arn
        maxReceiveCount: 5

  OrdersApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: OrdersApi
      StageName: prod
      # Stage-level caching: provision a cache cluster and cache responses for 300s.
      CacheClusterEnabled: true
      CacheClusterSize: "0.5"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          CachingEnabled: true
          CacheTtlInSeconds: 300
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt OrdersUserPool.Arn
      DefinitionBody:
        openapi: "3.0.1"
        info:
          title: OrdersApi
        # Request validator: validate body against the schema before integration.
        x-amazon-apigateway-request-validators:
          body-only:
            validateRequestBody: true
            validateRequestParameters: false
        components:
          schemas:
            OrderRequest:
              type: object
              required:
                - orderId
                - itemId
              properties:
                orderId:
                  type: string
                itemId:
                  type: string
        paths:
          /orders:
            post:
              x-amazon-apigateway-request-validator: body-only
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: "#/components/schemas/OrderRequest"
              responses:
                "202":
                  description: Order accepted for asynchronous processing
                "400":
                  description: Invalid request body
              # Direct AWS service integration with SQS SendMessage - no Lambda.
              # API Gateway validates the body, enqueues the message, and returns 202.
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                credentials: !GetAtt ApiGatewayDynamoDBRole.Arn
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:sqs:path/${AWS::AccountId}/${OrderIntakeQueue.QueueName}"
                passthroughBehavior: never
                requestParameters:
                  integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
                requestTemplates:
                  application/json: "Action=SendMessage&MessageBody=$util.urlEncode($input.body)"
                responses:
                  default:
                    statusCode: "202"
                    responseTemplates:
                      application/json: |
                        { "message": "Order accepted for processing." }
          /orders/{orderId}:
            get:
              parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                    type: string
              responses:
                "200":
                  description: Orders for the given orderId
              # Direct AWS service integration with DynamoDB Query - no Lambda.
              x-amazon-apigateway-integration:
                type: aws
                httpMethod: POST
                credentials: !GetAtt ApiGatewayDynamoDBRole.Arn
                uri: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}:dynamodb:action/Query"
                passthroughBehavior: when_no_templates
                requestTemplates:
                  application/json: !Sub |
                    {
                      "TableName": "${OrdersGlobalTable}",
                      "KeyConditionExpression": "orderId = :oid",
                      "ExpressionAttributeValues": {
                        ":oid": { "S": "$input.params('orderId')" }
                      }
                    }
                responses:
                  default:
                    statusCode: "200"
                    responseTemplates:
                      application/json: |
                        #set($items = $input.path('$.Items'))
                        {
                          "orderId": "$input.params('orderId')",
                          "count": $input.path('$.Count'),
                          "items": [
                            #foreach($item in $items)
                            {
                              "orderId": "$item.orderId.S",
                              "itemId": "$item.itemId.S"#if($item.createdAt.S != ""),
                              "createdAt": "$item.createdAt.S"#end

                            }#if($foreach.hasNext),#end
                            #end
                          ]
                        }

  # Global Table: multi-region replicas for disaster recovery and availability.
  # NOTE: converting from AWS::DynamoDB::Table replaces the table (data is not
  # migrated). DynamoDB Streams are required and enabled below.
  OrdersGlobalTable:
    Type: AWS::DynamoDB::GlobalTable
    Properties:
      # No explicit TableName: CloudFormation auto-generates a unique name so the
      # new global table does not collide with the old "Orders" table during replace.
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH
        - AttributeName: itemId
          KeyType: RANGE
      # Streams are mandatory for global tables; capture full before/after images.
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      SSESpecification:
        SSEEnabled: true
      Replicas:
        # Primary region (must match the stack's deployment region).
        - Region: us-east-1
          PointInTimeRecoverySpecification:
            PointInTimeRecoveryEnabled: true
        # Secondary region for disaster recovery / multi-region availability.
        - Region: us-west-2
          PointInTimeRecoverySpecification:
            PointInTimeRecoveryEnabled: true

  # Custom EventBridge bus that carries domain events such as OrderCreated.
  OrdersEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: OrdersEventBus

  SaveOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: SaveOrder
      Description: Saves an order item to the Orders DynamoDB table.
      CodeUri: src/save-order/
      Handler: index.handler
      Environment:
        Variables:
          ORDERS_TABLE: !Ref OrdersGlobalTable
          EVENT_BUS_NAME: !Ref OrdersEventBus
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref OrdersGlobalTable
        # Allow publishing events to the custom bus.
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref OrdersEventBus
      Events:
        FromIntakeQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt OrderIntakeQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ---------------------------------------------------------------------------
  # Asynchronous fulfilment pipeline:
  #   OrderCreated event -> EventBridge rule -> SQS queue -> FulfilOrder Lambda
  #   -> Fulfilment DynamoDB table
  # ---------------------------------------------------------------------------

  # Dead-letter queue for messages that repeatedly fail processing.
  OrderFulfilmentDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: OrderFulfilmentDLQ
      MessageRetentionPeriod: 1209600 # 14 days

  # Main queue that buffers OrderCreated events for async processing.
  OrderFulfilmentQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: OrderFulfilmentQueue
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrderFulfilmentDLQ.Arn
        maxReceiveCount: 5

  # Allow EventBridge to send matched events to the queue.
  OrderFulfilmentQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref OrderFulfilmentQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt OrderFulfilmentQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt OrderCreatedRule.Arn

  # Rule on the custom bus that routes OrderCreated events to the queue.
  OrderCreatedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: OrderCreatedToQueue
      EventBusName: !Ref OrdersEventBus
      EventPattern:
        source:
          - orders.service
        detail-type:
          - OrderCreated
      Targets:
        - Id: OrderFulfilmentQueueTarget
          Arn: !GetAtt OrderFulfilmentQueue.Arn

  # ---------------------------------------------------------------------------
  # Order notifications:
  #   OrderCreated event -> EventBridge rule -> SNS topic -> subscribers
  # ---------------------------------------------------------------------------

  # SNS topic that fans out order notifications to subscribers (email, SMS, etc.).
  OrderNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: OrderNotifications
      DisplayName: Order Notifications

  # Resource policy allowing EventBridge to publish to the topic.
  OrderNotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref OrderNotificationTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref OrderNotificationTopic
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt OrderNotificationRule.Arn

  # Rule on the custom bus that publishes OrderCreated events to the SNS topic.
  OrderNotificationRule:
    Type: AWS::Events::Rule
    Properties:
      Name: OrderCreatedToNotification
      EventBusName: !Ref OrdersEventBus
      EventPattern:
        source:
          - orders.service
        detail-type:
          - OrderCreated
      Targets:
        - Id: OrderNotificationTopicTarget
          Arn: !Ref OrderNotificationTopic

  # New table that stores fulfilment records produced by FulfilOrder.
  FulfilmentTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: OrderFulfilments
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: orderId
          AttributeType: S
      KeySchema:
        - AttributeName: orderId
          KeyType: HASH

  # Lambda that consumes the queue and writes a fulfilment record.
  FulfilOrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: FulfilOrder
      Description: Consumes OrderCreated messages from SQS and records fulfilment.
      CodeUri: src/fulfil-order/
      Handler: index.handler
      Environment:
        Variables:
          FULFILMENT_TABLE: !Ref FulfilmentTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref FulfilmentTable
      Events:
        FromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt OrderFulfilmentQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  OrdersWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: OrdersApiRateLimit
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: OrdersApiWebAcl
      Rules:
        - Name: RateLimitRule
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 1000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: OrdersApiRateLimitRule

  OrdersWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${OrdersApi}/stages/prod"
      WebACLArn: !GetAtt OrdersWebAcl.Arn

  OrdersDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: OrdersDashboard
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API Gateway - Count & 4XXError",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "view": "timeSeries",
                "metrics": [
                  [ "AWS/ApiGateway", "Count", "ApiName", "OrdersApi", { "stat": "Sum" } ],
                  [ "AWS/ApiGateway", "4XXError", "ApiName", "OrdersApi", { "stat": "Sum" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Lambda - Invocations & Errors",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "view": "timeSeries",
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "${SaveOrderFunction}", { "stat": "Sum" } ],
                  [ "AWS/Lambda", "Errors", "FunctionName", "${SaveOrderFunction}", { "stat": "Sum" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 24,
              "height": 6,
              "properties": {
                "title": "Event-driven pipeline - EventBridge / SQS / SNS",
                "region": "${AWS::Region}",
                "stat": "Sum",
                "period": 300,
                "view": "timeSeries",
                "metrics": [
                  [ "AWS/Events", "MatchedEvents", "EventBusName", "${OrdersEventBus}", "RuleName", "OrderCreatedToQueue", { "stat": "Sum", "label": "EventBridge MatchedEvents (fulfilment)" } ],
                  [ "AWS/Events", "MatchedEvents", "EventBusName", "${OrdersEventBus}", "RuleName", "OrderCreatedToNotification", { "stat": "Sum", "label": "EventBridge MatchedEvents (notification)" } ],
                  [ "AWS/SQS", "NumberOfMessagesSent", "QueueName", "${OrderFulfilmentQueue.QueueName}", { "stat": "Sum", "label": "SQS NumberOfMessagesSent" } ],
                  [ "AWS/SNS", "NumberOfMessagesPublished", "TopicName", "${OrderNotificationTopic.TopicName}", { "stat": "Sum", "label": "SNS NumberOfMessagesPublished" } ]
                ]
              }
            }
          ]
        }

Outputs:
  OrdersTableName:
    Description: Name of the Orders DynamoDB table
    Value: !Ref OrdersGlobalTable
  OrdersTableArn:
    Description: ARN of the Orders DynamoDB table
    Value: !GetAtt OrdersGlobalTable.Arn
  SaveOrderFunctionArn:
    Description: ARN of the SaveOrder Lambda function
    Value: !GetAtt SaveOrderFunction.Arn
  OrdersEventBusName:
    Description: Name of the custom EventBridge event bus
    Value: !Ref OrdersEventBus
  OrdersEventBusArn:
    Description: ARN of the custom EventBridge event bus
    Value: !GetAtt OrdersEventBus.Arn
  OrderIntakeQueueUrl:
    Description: URL of the order intake SQS queue (API Gateway target)
    Value: !Ref OrderIntakeQueue
  OrderFulfilmentQueueUrl:
    Description: URL of the order fulfilment SQS queue
    Value: !Ref OrderFulfilmentQueue
  OrderNotificationTopicArn:
    Description: ARN of the order notification SNS topic
    Value: !Ref OrderNotificationTopic
  FulfilOrderFunctionArn:
    Description: ARN of the FulfilOrder Lambda function
    Value: !GetAtt FulfilOrderFunction.Arn
  FulfilmentTableName:
    Description: Name of the OrderFulfilments DynamoDB table
    Value: !Ref FulfilmentTable
  OrdersApiEndpoint:
    Description: Invoke URL for the POST /orders endpoint
    Value: !Sub "https://${OrdersApi}.execute-api.${AWS::Region}.amazonaws.com/prod/orders"
  GetOrderEndpoint:
    Description: Invoke URL for the GET /orders/{orderId} endpoint (direct DynamoDB integration)
    Value: !Sub "https://${OrdersApi}.execute-api.${AWS::Region}.amazonaws.com/prod/orders/{orderId}"
  UserPoolId:
    Description: ID of the Cognito User Pool
    Value: !Ref OrdersUserPool
  UserPoolClientId:
    Description: ID of the Cognito User Pool App Client
    Value: !Ref OrdersUserPoolClient
  DashboardUrl:
    Description: URL of the CloudWatch dashboard
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=OrdersDashboard"
