<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" viewBox="0 0 1180 640" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .svc-label { font-size: 11px; fill: #232f3e; text-anchor: middle; }
      .svc-sub   { font-size: 9px; fill: #5f6b7a; text-anchor: middle; }
      .grp-label { font-size: 11px; font-weight: bold; }
      .flow      { stroke: #37475a; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flow-dash { stroke: #879196; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .repl      { stroke: #3fae5a; stroke-width: 2; fill: none; marker-end: url(#arrowg); marker-start: url(#arrowg); }
      .edge-lbl  { font-size: 9px; fill: #37475a; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#37475a"/></marker>
    <marker id="arrowg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3fae5a"/></marker>
  </defs>

  <rect x="0" y="0" width="1180" height="640" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="bold" fill="#232f3e">Orders Serverless Application — AWS Architecture</text>

  <!-- Client -->
  <rect x="30" y="90" width="70" height="70" rx="8" fill="#f2f4f6" stroke="#879196"/>
  <circle cx="65" cy="118" r="12" fill="#232f3e"/>
  <path d="M48 150 q17 -22 34 0" fill="#232f3e"/>
  <text class="svc-label" x="65" y="174">Client</text>

  <!-- Edge & Auth group -->
  <rect x="130" y="60" width="150" height="230" rx="10" fill="none" stroke="#d9534f" stroke-dasharray="6 4"/>
  <text class="grp-label" x="140" y="78" fill="#d9534f">Edge &amp; Auth</text>
  <rect x="165" y="95" width="48" height="48" rx="8" fill="#d9534f"/>
  <path d="M189 103 l14 5 v9 c0 10 -7 15 -14 19 c-7 -4 -14 -9 -14 -19 v-9 Z" fill="#fff"/>
  <text class="svc-label" x="189" y="156">AWS WAF</text>
  <rect x="165" y="200" width="48" height="48" rx="8" fill="#d9534f"/>
  <circle cx="189" cy="217" r="8" fill="#fff"/>
  <path d="M175 243 q14 -17 28 0" fill="#fff"/>
  <text class="svc-label" x="189" y="262">Cognito</text>

  <!-- API Gateway group -->
  <rect x="310" y="60" width="200" height="230" rx="10" fill="none" stroke="#4a7fd9" stroke-dasharray="6 4"/>
  <text class="grp-label" x="320" y="78" fill="#4a7fd9">API Gateway (prod)</text>
  <rect x="370" y="90" width="48" height="48" rx="8" fill="#8c4fff"/>
  <circle cx="394" cy="114" r="15" fill="none" stroke="#fff" stroke-width="3"/>
  <circle cx="379" cy="114" r="3.5" fill="#fff"/><circle cx="409" cy="114" r="3.5" fill="#fff"/>
  <circle cx="394" cy="99" r="3.5" fill="#fff"/><circle cx="394" cy="129" r="3.5" fill="#fff"/>
  <text class="svc-label" x="394" y="151">API Gateway</text>
  <text class="svc-sub" x="394" y="163">cache 300s</text>
  <rect x="325" y="200" width="80" height="34" rx="6" fill="#eef3fb" stroke="#4a7fd9"/>
  <text class="svc-label" x="365" y="221">POST /orders</text>
  <rect x="325" y="246" width="170" height="34" rx="6" fill="#eef3fb" stroke="#4a7fd9"/>
  <text class="svc-label" x="410" y="263">GET /orders/{orderId}</text>
  <text class="svc-sub" x="410" y="274">direct — no Lambda</text>

  <!-- SaveOrder Lambda -->
  <rect x="545" y="80" width="130" height="90" rx="10" fill="none" stroke="#e0952b" stroke-dasharray="6 4"/>
  <text class="grp-label" x="555" y="98" fill="#e0952b">Compute</text>
  <rect x="580" y="105" width="48" height="48" rx="8" fill="#ed8b00"/>
  <path d="M589 148 l12 -34 h7 l-12 34 Z M608 114 l12 34 h7 l-12 -34 Z" fill="#fff"/>
  <text class="svc-label" x="604" y="167">SaveOrder</text>

  <!-- DynamoDB Global Table group -->
  <rect x="710" y="60" width="340" height="150" rx="10" fill="none" stroke="#3fae5a" stroke-dasharray="6 4"/>
  <text class="grp-label" x="720" y="78" fill="#3fae5a">DynamoDB Global Table — Orders</text>
  <rect x="745" y="95" width="48" height="48" rx="8" fill="#2e73b8"/>
  <path d="M769 101 c12 0 17 3 17 7 v29 c0 4 -5 7 -17 7 c-12 0 -17 -3 -17 -7 v-29 c0 -4 5 -7 17 -7 Z" fill="#fff"/>
  <text class="svc-label" x="769" y="156">Primary</text>
  <text class="svc-sub" x="769" y="168">us-east-1</text>
  <rect x="950" y="95" width="48" height="48" rx="8" fill="#2e73b8"/>
  <path d="M974 101 c12 0 17 3 17 7 v29 c0 4 -5 7 -17 7 c-12 0 -17 -3 -17 -7 v-29 c0 -4 5 -7 17 -7 Z" fill="#fff"/>
  <text class="svc-label" x="974" y="156">Replica</text>
  <text class="svc-sub" x="974" y="168">us-west-2 (DR)</text>

  <!-- Async pipeline group -->
  <rect x="130" y="330" width="1020" height="150" rx="10" fill="none" stroke="#e7157b" stroke-dasharray="6 4"/>
  <text class="grp-label" x="140" y="348" fill="#e7157b">Asynchronous Fulfilment Pipeline</text>

  <!-- EventBridge -->
  <rect x="165" y="370" width="48" height="48" rx="8" fill="#e7157b"/>
  <path d="M179 382 h20 v8 h-20 Z M179 395 h20 v8 h-20 Z" fill="#fff"/>
  <text class="svc-label" x="189" y="432">EventBridge</text>
  <text class="svc-sub" x="189" y="444">OrderCreated rule</text>

  <!-- SQS -->
  <rect x="400" y="370" width="48" height="48" rx="8" fill="#e7157b"/>
  <path d="M412 388 h24 M412 394 h24 M412 400 h24" stroke="#fff" stroke-width="3"/>
  <text class="svc-label" x="424" y="432">SQS Queue</text>
  <text class="svc-sub" x="424" y="444">OrderFulfilment</text>

  <!-- DLQ -->
  <rect x="400" y="500" width="48" height="48" rx="8" fill="#e7157b"/>
  <path d="M412 518 h24 M412 524 h24 M412 530 h24" stroke="#fff" stroke-width="3"/>
  <text class="svc-label" x="424" y="562">DLQ</text>

  <!-- FulfilOrder Lambda -->
  <rect x="640" y="370" width="48" height="48" rx="8" fill="#ed8b00"/>
  <path d="M649 413 l12 -34 h7 l-12 34 Z M668 379 l12 34 h7 l-12 -34 Z" fill="#fff"/>
  <text class="svc-label" x="664" y="432">FulfilOrder</text>

  <!-- Fulfilment table -->
  <rect x="880" y="370" width="48" height="48" rx="8" fill="#2e73b8"/>
  <path d="M904 376 c12 0 17 3 17 7 v29 c0 4 -5 7 -17 7 c-12 0 -17 -3 -17 -7 v-29 c0 -4 5 -7 17 -7 Z" fill="#fff"/>
  <text class="svc-label" x="904" y="432">DynamoDB</text>
  <text class="svc-sub" x="904" y="444">OrderFulfilments</text>

  <!-- Observability -->
  <rect x="710" y="230" width="200" height="80" rx="10" fill="none" stroke="#8a5ad9" stroke-dasharray="6 4"/>
  <text class="grp-label" x="720" y="248" fill="#8a5ad9">Observability</text>
  <rect x="735" y="256" width="42" height="42" rx="8" fill="#8a5ad9"/>
  <path d="M744 285 l8 -11 l6 8 l10 -16" fill="none" stroke="#fff" stroke-width="3"/>
  <text class="svc-label" x="756" y="312">CloudWatch</text>
  <rect x="840" y="256" width="42" height="42" rx="8" fill="#8a5ad9"/>
  <circle cx="861" cy="277" r="10" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M861 277 l8 8" stroke="#fff" stroke-width="3"/>
  <text class="svc-label" x="861" y="312">X-Ray</text>

  <!-- CI/CD -->
  <rect x="950" y="230" width="200" height="80" rx="10" fill="none" stroke="#7a8a99" stroke-dasharray="6 4"/>
  <text class="grp-label" x="960" y="248" fill="#7a8a99">CI/CD</text>
  <rect x="975" y="256" width="42" height="42" rx="8" fill="#24292e"/>
  <circle cx="996" cy="277" r="13" fill="#fff"/>
  <circle cx="996" cy="277" r="6" fill="#24292e"/>
  <text class="svc-label" x="1070" y="273">GitHub Actions</text>
  <text class="svc-sub" x="1070" y="286">push to main</text>

  <!-- FLOWS -->
  <path class="flow" d="M100 120 L163 118"/>
  <path class="flow" d="M213 118 L368 112"/>
  <path class="flow-dash" d="M370 220 L215 222"/>
  <text class="edge-lbl" x="270" y="214">JWT</text>
  <path class="flow" d="M405 217 L578 135"/>
  <text class="edge-lbl" x="470" y="150">POST</text>
  <path class="flow" d="M495 262 L744 130"/>
  <text class="edge-lbl" x="560" y="240">GET (direct)</text>
  <path class="flow" d="M628 125 L743 118"/>
  <text class="edge-lbl" x="650" y="110">PutItem</text>
  <path class="repl" d="M793 119 L948 119"/>
  <text class="edge-lbl" x="820" y="112" fill="#3fae5a">replication</text>
  <path class="flow" d="M604 153 Q400 250 189 368"/>
  <text class="edge-lbl" x="320" y="310">OrderCreated</text>
  <path class="flow" d="M213 394 L398 394"/>
  <text class="edge-lbl" x="280" y="388">route</text>
  <path class="flow-dash" d="M424 418 L424 498"/>
  <text class="edge-lbl" x="430" y="465">5 fails</text>
  <path class="flow" d="M448 394 L638 394"/>
  <path class="flow" d="M688 394 L878 394"/>
  <text class="edge-lbl" x="770" y="388">PutItem</text>
</svg>
