<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .svc-label { font-size: 12px; fill: #232f3e; text-anchor: middle; }
      .svc-sub   { font-size: 10px; fill: #5f6b7a; text-anchor: middle; }
      .grp-label { font-size: 12px; font-weight: bold; fill: #5f6b7a; }
      .flow      { stroke: #37475a; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flow-dash { stroke: #879196; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .repl      { stroke: #3fae5a; stroke-width: 2; fill: none; marker-end: url(#arrowg); marker-start: url(#arrowg); }
      .edge-lbl  { font-size: 10px; fill: #37475a; }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#37475a"/></marker>
    <marker id="arrowg" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3fae5a"/></marker>
  </defs>

  <rect x="0" y="0" width="1100" height="760" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#232f3e">Orders Serverless Application — AWS Architecture</text>

  <!-- Client -->
  <g>
    <rect x="40" y="110" width="90" height="90" rx="8" fill="#f2f4f6" stroke="#879196"/>
    <circle cx="85" cy="145" r="14" fill="#232f3e"/>
    <path d="M65 180 q20 -26 40 0" fill="#232f3e"/>
    <text class="svc-label" x="85" y="212">Client</text>
  </g>

  <!-- Security / Edge group -->
  <rect x="190" y="70" width="200" height="300" rx="10" fill="none" stroke="#d9534f" stroke-dasharray="6 4"/>
  <text class="grp-label" x="202" y="90" fill="#d9534f">Edge &amp; Auth</text>

  <!-- WAF icon -->
  <g>
    <rect x="235" y="110" width="56" height="56" rx="8" fill="#d9534f"/>
    <path d="M263 120 l16 6 v10 c0 11 -8 18 -16 22 c-8 -4 -16 -11 -16 -22 v-10 Z" fill="#fff"/>
    <text class="svc-label" x="263" y="182">AWS WAF</text>
    <text class="svc-sub" x="263" y="196">Rate limit</text>
  </g>

  <!-- Cognito icon -->
  <g>
    <rect x="235" y="250" width="56" height="56" rx="8" fill="#d9534f"/>
    <circle cx="263" cy="270" r="9" fill="#fff"/>
    <path d="M247 298 q16 -20 32 0" fill="#fff"/>
    <text class="svc-label" x="263" y="322">Cognito</text>
    <text class="svc-sub" x="263" y="336">User Pool (JWT)</text>
  </g>

  <!-- API Gateway group -->
  <rect x="430" y="70" width="230" height="300" rx="10" fill="none" stroke="#4a7fd9" stroke-dasharray="6 4"/>
  <text class="grp-label" x="442" y="90" fill="#4a7fd9">API Gateway (prod stage)</text>

  <!-- API GW icon -->
  <g>
    <rect x="505" y="105" width="56" height="56" rx="8" fill="#8c4fff"/>
    <circle cx="533" cy="133" r="18" fill="none" stroke="#fff" stroke-width="3"/>
    <circle cx="515" cy="133" r="4" fill="#fff"/><circle cx="551" cy="133" r="4" fill="#fff"/>
    <circle cx="533" cy="115" r="4" fill="#fff"/><circle cx="533" cy="151" r="4" fill="#fff"/>
    <text class="svc-label" x="533" y="178">API Gateway</text>
    <text class="svc-sub" x="533" y="192">Cache TTL 300s</text>
  </g>

  <!-- POST method -->
  <rect x="445" y="230" width="90" height="40" rx="6" fill="#eef3fb" stroke="#4a7fd9"/>
  <text class="svc-label" x="490" y="255">POST /orders</text>

  <!-- GET method -->
  <rect x="445" y="300" width="200" height="40" rx="6" fill="#eef3fb" stroke="#4a7fd9"/>
  <text class="svc-label" x="545" y="320">GET /orders/{orderId}</text>
  <text class="svc-sub" x="545" y="333">direct integration (no Lambda)</text>

  <!-- Lambda group / icon -->
  <rect x="700" y="200" width="150" height="120" rx="10" fill="none" stroke="#e0952b" stroke-dasharray="6 4"/>
  <text class="grp-label" x="712" y="220" fill="#e0952b">Compute</text>
  <g>
    <rect x="747" y="232" width="56" height="56" rx="8" fill="#ed8b00"/>
    <path d="M757 282 l14 -40 h8 l-14 40 Z M779 242 l14 40 h8 l-14 -40 Z" fill="#fff"/>
    <text class="svc-label" x="775" y="304">Lambda</text>
    <text class="svc-sub" x="775" y="317">SaveOrder • X-Ray</text>
  </g>

  <!-- DynamoDB Global Table group -->
  <rect x="700" y="430" width="360" height="200" rx="10" fill="none" stroke="#3fae5a" stroke-dasharray="6 4"/>
  <text class="grp-label" x="712" y="450" fill="#3fae5a">DynamoDB Global Table — Orders</text>

  <!-- Primary -->
  <g>
    <rect x="730" y="475" width="56" height="56" rx="8" fill="#2e73b8"/>
    <path d="M758 483 c14 0 20 4 20 8 v34 c0 4 -6 8 -20 8 c-14 0 -20 -4 -20 -8 v-34 c0 -4 6 -8 20 -8 Z" fill="#fff"/>
    <path d="M738 491 c0 4 6 8 20 8 c14 0 20 -4 20 -8" fill="none" stroke="#2e73b8" stroke-width="2"/>
    <text class="svc-label" x="758" y="548">Primary</text>
    <text class="svc-sub" x="758" y="562">us-east-1 • streams</text>
  </g>

  <!-- Replica -->
  <g>
    <rect x="965" y="475" width="56" height="56" rx="8" fill="#2e73b8"/>
    <path d="M993 483 c14 0 20 4 20 8 v34 c0 4 -6 8 -20 8 c-14 0 -20 -4 -20 -8 v-34 c0 -4 6 -8 20 -8 Z" fill="#fff"/>
    <path d="M973 491 c0 4 6 8 20 8 c14 0 20 -4 20 -8" fill="none" stroke="#2e73b8" stroke-width="2"/>
    <text class="svc-label" x="993" y="548">Replica</text>
    <text class="svc-sub" x="993" y="562">us-west-2 • DR</text>
  </g>

  <!-- Observability -->
  <rect x="40" y="430" width="300" height="130" rx="10" fill="none" stroke="#8a5ad9" stroke-dasharray="6 4"/>
  <text class="grp-label" x="52" y="450" fill="#8a5ad9">Observability</text>
  <g>
    <rect x="70" y="470" width="52" height="52" rx="8" fill="#8a5ad9"/>
    <path d="M80 505 l10 -14 l8 10 l12 -20" fill="none" stroke="#fff" stroke-width="3"/>
    <text class="svc-label" x="96" y="538">CloudWatch</text>
  </g>
  <g>
    <rect x="220" y="470" width="52" height="52" rx="8" fill="#8a5ad9"/>
    <circle cx="246" cy="496" r="12" fill="none" stroke="#fff" stroke-width="3"/>
    <path d="M246 496 l10 10" stroke="#fff" stroke-width="3"/>
    <text class="svc-label" x="246" y="538">X-Ray</text>
  </g>

  <!-- CI/CD -->
  <rect x="380" y="430" width="280" height="130" rx="10" fill="none" stroke="#7a8a99" stroke-dasharray="6 4"/>
  <text class="grp-label" x="392" y="450" fill="#7a8a99">CI/CD</text>
  <g>
    <rect x="420" y="470" width="52" height="52" rx="8" fill="#24292e"/>
    <circle cx="446" cy="496" r="16" fill="#fff"/>
    <circle cx="446" cy="496" r="8" fill="#24292e"/>
    <text class="svc-label" x="446" y="538">GitHub Actions</text>
    <text class="svc-sub" x="540" y="492">push to main</text>
    <text class="svc-sub" x="540" y="506">→ sam deploy</text>
  </g>

  <!-- FLOWS -->
  <path class="flow" d="M130 150 L233 140"/>
  <path class="flow" d="M291 138 L503 135"/>
  <path class="flow" d="M520 161 L495 228"/>
  <path class="flow" d="M540 161 L545 298"/>
  <path class="flow" d="M535 250 L746 262"/>
  <path class="flow" d="M775 320 L762 473"/>
  <text class="edge-lbl" x="700" y="400">PutItem (write)</text>
  <path class="flow" d="M645 325 Q690 420 735 475"/>
  <text class="edge-lbl" x="640" y="430">Query (IAM role)</text>
  <path class="flow-dash" d="M445 250 L293 272"/>
  <text class="edge-lbl" x="330" y="248">JWT</text>
  <path class="repl" d="M786 503 L963 503"/>
  <text class="edge-lbl" x="820" y="495" fill="#3fae5a">stream replication</text>
  <path class="flow-dash" d="M747 300 Q400 360 272 476"/>
  <path class="flow-dash" d="M472 476 Q520 400 545 165"/>
</svg>
